            font-size: 0.9rem;
            line-height: 1.5;
        }
        .controls {

            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;

            padding: 12px 20px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 30px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;

        .search-bar:focus, .district-filter:focus {

            box-shadow: 0 0 8px rgba(0, 51, 102, 0.2);
        }
        .stats {

            text-align: right;
            padding: 0 15px;
            max-width: 1000px;
            margin: 0 auto 10px;
            font-size: 0.9rem;
            color: #666;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .district-badge {
            background: var(--secondary);
            color: white;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            align-self: flex-start;
            margin-bottom: 10px;
        }

            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }
        .phone {

            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;

        .btn-wa {

        }
        .btn-disabled {

            cursor: not-allowed;
        }

            .controls { flex-direction: column; }
        }

        const nepaliToEnglishMap = {'०':'0', '१':'1', '२':'2', '३':'3', '४':'4', '५':'5', '६':'6', '७':'7', '८':'8', '९':'9'};
        
        // Convert Nepali digits to English for links
        function getCleanPhone(nepaliNum) {
            let eng = nepaliNum.replace(/[०-९]/g, m => nepaliToEnglishMap[m]);
            return eng.replace(/\D/g,''); // Keep only digits
        }

        // Initialize App
        function init() {
            populateDistricts();
            renderCards(homestays);
            
            document.getElementById('searchInput').addEventListener('input', filterData);
            document.getElementById('districtFilter').addEventListener('change', filterData);
        }

        // Populate dropdown
        function populateDistricts() {
            const districts = [...new Set(homestays.map(item => item.district))].sort();
            const select = document.getElementById('districtFilter');
            districts.forEach(d => {
                const option = document.createElement('option');
                option.value = d;
                option.textContent = d;
                select.appendChild(option);
            });
        }

        // Filter Logic
        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedDistrict = document.getElementById('districtFilter').value;
            
            const filtered = homestays.filter(item => {
                const matchName = item.name.toLowerCase().includes(query) || item.phone.includes(query);
                const matchDistrict = selectedDistrict === 'All' || item.district === selectedDistrict;
                return matchName && matchDistrict;
            });
            
            renderCards(filtered);
        }

        // Render UI Cards
        function renderCards(data) {
            const container = document.getElementById('cardContainer');
            document.getElementById('statsCounter').textContent = `Showing ${data.length} homestays`;
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color:#777;">No homestays found matching your criteria.</p>';
                return;
            }

            data.forEach(item => {
                const engPhone = getCleanPhone(item.phone);
                const isValidPhone = engPhone.length >= 10 && !engPhone.startsWith('000');
                
                let waButton = `<span class="btn btn-disabled">No WA</span>`;
                let callButton = `<span class="btn btn-disabled">No Call</span>`;
                
                if (isValidPhone) {
                    // Assuming Nepal code +977
                    waButton = `<a href="https://wa.me/977${engPhone}" target="_blank" class="btn btn-wa">💬 WhatsApp</a>`;
                    callButton = `<a href="tel:${engPhone}" class="btn btn-call">📞 Call</a>`;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="district-badge">${item.district}</span>
                    <div class="homestay-name">${item.name}</div>
                    <div class="phone">📱 ${item.phone}</div>
                    <div class="actions">
                        ${callButton}
                        ${waButton}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = init;
    </script>
